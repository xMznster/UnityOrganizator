<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F7F5">
  <meta name="description" content="Organizator – minimalistische Boards mit Listen und Karten. Offline, automatisch gespeichert.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Organizator">
  <meta name="format-detection" content="telephone=no">
  <title>Organizator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before the first paint (no white flash in dark mode).
    try {
      var s = JSON.parse(localStorage.getItem("organizator.settings") || "{}");
      var dark = s.theme === "dark" || (s.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) {}
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true"><span class="logo" style="width:44px;height:44px;padding:11px;gap:4px"><i></i><i></i><i></i></span></div>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Organizator benötigt JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
